[project]
name = "fargate-jmeter-runner"
version = "0.1.0"
description = "Result tooling and tests for distributed JMeter runs on ECS Fargate"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# tools/jtl_summary.py is standard-library only; it is copied into the image as-is.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"
src = [".", "tools"]
extend-exclude = ["tests/fixtures"]
# The aws/jmeter stand-ins are extension-less Python scripts; lint them too.
extend-include = ["tests/fakes/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PTH"]

[tool.ruff.format]
quote-style = "double"
